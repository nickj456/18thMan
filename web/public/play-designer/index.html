<!doctype html>
<html lang="en">
<head>
<title>18thMan Play Designer</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/play-designer/logo.png">
<style>
@font-face { font-family: "Permanent Marker"; src: url("/play-designer/fonts/PermanentMarker-Regular.ttf"); }
@font-face { font-family: "Kalam"; font-weight: 400; src: url("/play-designer/fonts/Kalam-Regular.ttf"); }
@font-face { font-family: "Kalam"; font-weight: 700; src: url("/play-designer/fonts/Kalam-Bold.ttf"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url("/play-designer/fonts/BarlowSemiCondensed-Medium.ttf"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; src: url("/play-designer/fonts/BarlowSemiCondensed-SemiBold.ttf"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; src: url("/play-designer/fonts/BarlowSemiCondensed-Bold.ttf"); }
</style>
<style>
/* Layout: playlist rail | whiteboard canvas | inspector. Stacks to one column on phones. Board itself is always whiteboard white. */
:root {
  --bg: #e4e6e8;
  --panel: #f6f7f8;
  --line: #c9cdd1;
  --ink: #17191b;
  --muted: #5d636a;
  --orange: #f2620f;
  --orange-soft: #fde6d6;
  --blue: #1c5fd0;
  --warn: #c62828;
  --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --hand: "Kalam", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191c; --panel: #1f2327; --line: #343a40; --ink: #eef0f2; --muted: #9aa2aa; --orange-soft: #3a2416; --warn: #ff6b6b; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #16191c; --panel: #1f2327; --line: #343a40; --ink: #eef0f2; --muted: #9aa2aa; --orange-soft: #3a2416; --warn: #ff6b6b; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; }
.app {
  display: grid; grid-template-columns: 210px minmax(0, 1fr) 280px; gap: 16px;
  max-width: 1400px; margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  align-items: start;
}
@media (min-width: 1001px) {
  .rail, .inspector {
    position: sticky; top: calc(16px + env(safe-area-inset-top, 0px));
    max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .board { max-width: min(620px, calc((100vh - 150px) * 0.8)); }
  .transport { max-width: min(620px, calc((100vh - 150px) * 0.8)); }
}
@media (max-width: 1000px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { order: 2; } .inspector { order: 3; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 700; }
.plays { display: flex; flex-direction: column; gap: 4px; }
.plays button { text-align: left; }
.plays button.on { background: var(--orange-soft); border-color: var(--orange); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button {
  font: 600 15px var(--ui); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: var(--orange); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
button.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
button.danger { color: var(--warn); }
button:disabled { opacity: .45; cursor: default; }
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tools button { display: flex; gap: 6px; align-items: center; }
.tools button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tools .k { font-size: 12px; opacity: .6; }
.hint { font-size: 15px; color: var(--muted); min-height: 1.4em; }
.board { background: #c9ced3; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: 620px; width: 100%; margin: 0 auto; touch-action: none; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; cursor: crosshair; }
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 620px; width: 100%; margin: 0 auto; }
.transport input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--orange); }
.time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 92px; }
label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); }
input[type=text], input[type=number], textarea, select {
  font: 500 15px var(--ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; box-sizing: border-box;
}
textarea { font-family: var(--hand); font-size: 17px; resize: vertical; min-height: 70px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.warn { color: var(--warn); font-weight: 600; font-size: 14px; }
.status { font-size: 14px; color: var(--muted); }
.passItem { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.help { font-size: 14px; color: var(--muted); line-height: 1.45; margin: 0; padding-left: 18px; }
/* Desktop and landscape tablet: the whole editor fits in one screen with no page scroll.
   The board takes whatever height is left and keeps its 4:5 shape; side panels scroll on their own. */
@media (min-width: 1001px) {
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .app { height: 100vh; box-sizing: border-box; padding-block: 12px; }
  .rail, .inspector { position: static; max-height: calc(100vh - 24px); }
  .stage { height: calc(100vh - 24px); min-height: 0; gap: 8px; }
  .tools button { padding: 5px 8px; font-size: 14px; }
  .hint { height: 2.8em; overflow: hidden; font-size: 14px; }
  .boardWrap { flex: 1 1 auto; min-height: 0; container-type: size; display: flex; justify-content: center; align-items: center; }
  .board, .boardWrap .board { width: min(100cqw, 80cqh); max-width: none; margin: 0; }
  .transport { max-width: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel rail">
    <h2>Playlist</h2>
    <div class="plays" id="plays"></div>
    <div class="row">
      <button id="newPlay" type="button">New play</button>
      <button id="dupPlay" type="button">Duplicate</button>
    </div>
    <button id="delPlay" type="button" class="danger">Delete play</button>
    <h2 style="margin-top:8px">Save</h2>
    <button id="save" type="button" class="primary">Save playlist</button>
    <div class="status" id="status">Loading…</div>
    <button id="exportPlaylist" type="button">Back up playlist (.json)</button>
    <button id="importPlaylist" type="button">Open playlist file</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <h2 style="margin-top:8px">Export</h2>
    <button id="exportVideo" type="button">Export video</button>
    <button id="exportPng" type="button">Save still (PNG)</button>
    <div class="status" id="exportStatus"></div>
  </aside>

  <main class="stage">
    <div class="tools" id="tools">
      <button type="button" data-tool="select">Move <span class="k">V</span></button>
      <button type="button" data-tool="x">Add X <span class="k">X</span></button>
      <button type="button" data-tool="o">Add O <span class="k">O</span></button>
      <button type="button" data-tool="run">Draw run <span class="k">R</span></button>
      <button type="button" data-tool="pass">Pass <span class="k">P</span></button>
      <button type="button" data-tool="note">Note <span class="k">N</span></button>
      <button type="button" data-tool="circle">Circle <span class="k">C</span></button>
      <button type="button" data-tool="pan">Pan <span class="k">H</span></button>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <span class="time" id="zoomLbl" style="min-width:48px;text-align:center">100%</span>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoomFit">Fit</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="boardWrap"><div class="board"><canvas id="cv" width="1080" height="1350" aria-label="Whiteboard play editor"></canvas></div></div>
    <div class="transport">
      <button id="play" type="button" class="primary">Play</button>
      <button id="toStart" type="button">Start</button>
      <input id="scrub" type="range" min="0" max="15" step="0.05" value="0" aria-label="Timeline">
      <span class="time" id="time">0.0 / 15s</span>
      <label class="inline"><input type="checkbox" id="loop" checked> Loop</label>
      <label class="inline"><input type="checkbox" id="ghost" checked> Show plan</label>
    </div>
  </main>

  <aside class="panel inspector" id="inspector"></aside>
</div>

<script type="application/json" id="seed">{"savedAt": 0, "plays": [{"id": "pkuqclz", "title": "Unders / Good Line", "subtitle": "", "duration": 12, "ballStart": "a77aea7", "players": [{"id": "djv4ve9", "team": "D", "x": 913, "y": 779, "path": [{"x": 856, "y": 766}, {"x": 834, "y": 721}], "t0": 1, "t1": 9, "highlight": false}, {"id": "dxtnbni", "team": "D", "x": 914, "y": 829, "path": [{"x": 928, "y": 836}, {"x": 968, "y": 871}], "t0": 1, "t1": 9, "highlight": false}, {"id": "a77aea7", "team": "A", "x": 912, "y": 867, "path": [], "t0": 1, "t1": 9, "highlight": false}, {"id": "a6shcyk", "team": "A", "x": 914, "y": 920, "path": [], "t0": 1, "t1": 9, "highlight": false}, {"id": "acuclgu", "team": "A", "x": 767, "y": 979, "path": [{"x": 750, "y": 946}, {"x": 715, "y": 793}, {"x": 746, "y": 712}, {"x": 818, "y": 646}], "t0": 1, "t1": 9, "highlight": false}, {"id": "a9d6dka", "team": "A", "x": 604, "y": 1024, "path": [{"x": 581, "y": 951}, {"x": 546, "y": 864}, {"x": 572, "y": 751}, {"x": 661, "y": 641}], "t0": 1, "t1": 9, "highlight": false}, {"id": "a7wyj29", "team": "A", "x": 408, "y": 1071, "path": [{"x": 384, "y": 958}, {"x": 379, "y": 817}, {"x": 473, "y": 686}], "t0": 1, "t1": 9, "highlight": false}, {"id": "a0a8nrs", "team": "A", "x": 192, "y": 1080, "path": [{"x": 192, "y": 951}, {"x": 208, "y": 807}, {"x": 341, "y": 686}], "t0": 1, "t1": 9, "highlight": false}, {"id": "d4xcwhb", "team": "D", "x": 721, "y": 639, "path": [{"x": 736, "y": 702}, {"x": 755, "y": 709}], "t0": 1, "t1": 9, "highlight": false}, {"id": "d449ai7", "team": "D", "x": 584, "y": 638, "path": [{"x": 586, "y": 667}, {"x": 565, "y": 699}, {"x": 584, "y": 721}], "t0": 1, "t1": 9, "highlight": false}, {"id": "d2jfb1r", "team": "D", "x": 442, "y": 638, "path": [{"x": 445, "y": 672}], "t0": 1, "t1": 9, "highlight": false}, {"id": "d1xps16", "team": "D", "x": 310, "y": 639, "path": [{"x": 311, "y": 662}, {"x": 314, "y": 690}], "t0": 1, "t1": 9, "highlight": false}], "passes": [{"id": "pssjmnp6", "from": "a77aea7", "to": "a6shcyk", "t": 0.5, "dur": 1.2}, {"id": "pshu22r6", "from": "a6shcyk", "to": "acuclgu", "t": 1.4, "dur": 1.2}], "notes": [], "logoSize": 100, "logoPos": {"x": 829, "y": 1191}, "titlePos": {"x": 125, "y": 139}, "iconScale": 0.65}]}</script>
<script>
(() => {
  const W = 1080, H = 1350;
  const PITCH = { l: 90, r: 990, t: 280, b: 1180 };
  const C = { ink: "#1b1d21", blue: "#1d56c4", orange: "#f2620f", board: "#f7f8f6", grey: "#5b6168", warn: "#c62828" };
  const MARKER = '"Permanent Marker", "Comic Sans MS", cursive';
  const HAND = '"Kalam", "Comic Sans MS", cursive';
  const DRAFT_KEY = "18thman-play-designer-draft";

  const $ = id => document.getElementById(id);
  const cv = $("cv"), mainCtx = cv.getContext("2d");
  let ctx = mainCtx;
  const uid = p => p + Math.random().toString(36).slice(2, 8);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;

  let state = { plays: [], savedAt: 0 };
  let cur = 0;
  let time = 0, playing = false, last = null;
  let tool = "select", sel = null, runFor = null, passFrom = null;
  let drag = null, dirty = false, undoStack = [];
  let recording = false;
  let view = { s: 1, x: 0, y: 0 }; // editor zoom: scale and top-left corner in board coords

  const play = () => state.plays[cur];
  const LOGO = new Image(); LOGO.src = "/play-designer/logo.png";

  // ---------- geometry ----------
  function spline(pts) {
    if (pts.length < 2) return { pts: pts.slice(), lens: [0], total: 0 };
    const out = [];
    const P = [pts[0], ...pts, pts[pts.length - 1]];
    for (let i = 1; i < P.length - 2; i++) {
      const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
      for (let s = 0; s < 16; s++) {
        const t = s / 16, t2 = t * t, t3 = t2 * t;
        out.push({
          x: .5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: .5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
        });
      }
    }
    out.push(pts[pts.length - 1]);
    const lens = [0];
    for (let i = 1; i < out.length; i++) lens.push(lens[i - 1] + Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y));
    return { pts: out, lens, total: lens[lens.length - 1] };
  }
  function pointAt(sp, d) {
    if (sp.pts.length === 1) return { ...sp.pts[0] };
    d = clamp(d, 0, sp.total);
    let i = 1; while (i < sp.lens.length - 1 && sp.lens[i] < d) i++;
    const a = sp.pts[i - 1], b = sp.pts[i], seg = sp.lens[i] - sp.lens[i - 1] || 1;
    const t = (d - sp.lens[i - 1]) / seg;
    return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) };
  }
  // A player's movement is a list of moves in time order. Each move starts where the previous one ended,
  // and the player stands still between moves.
  // Also normalises loaded data: ids and numbers end up in the inspector's innerHTML, so a crafted
  // playlist file must not be able to smuggle markup in through them.
  const safeId = (v, prefix) => /^[a-z0-9]{1,24}$/i.test(String(v)) ? String(v) : uid(prefix);
  const safeNum = (v, d, lo = 0, hi = 9999) => { const n = Number(v); return Number.isFinite(n) ? clamp(n, lo, hi) : d; };
  const safePt = w => ({ x: safeNum(w && w.x, 0, -W, 2 * W), y: safeNum(w && w.y, 0, -H, 2 * H) });
  function migrate(pl) {
    if (!pl || typeof pl !== "object") throw new Error("not a play");
    pl.id = safeId(pl.id, "p");
    pl.title = String(pl.title ?? ""); pl.subtitle = String(pl.subtitle ?? "");
    pl.duration = safeNum(pl.duration, 15, 3, 60);
    ["iconScale", "titleSize", "subSize", "logoSize", "pitchScale"].forEach(k => { if (pl[k] != null) pl[k] = safeNum(pl[k], undefined, 0, 1000); });
    const ids = new Map();
    pl.players = (Array.isArray(pl.players) ? pl.players : []).filter(p => p && typeof p === "object").map(p => {
      if (!p.moves) p.moves = Array.isArray(p.path) && p.path.length ? [{ path: p.path, t0: p.t0 ?? 1, t1: p.t1 ?? 9 }] : [];
      const id = safeId(p.id, "a"); ids.set(p.id, id);
      return {
        id, team: p.team === "D" ? "D" : "A", x: safeNum(p.x, W / 2, -W, 2 * W), y: safeNum(p.y, H / 2, -H, 2 * H), highlight: !!p.highlight,
        moves: (Array.isArray(p.moves) ? p.moves : []).filter(m => m && typeof m === "object").map(m => ({ path: (Array.isArray(m.path) ? m.path : []).map(safePt), t0: safeNum(m.t0, 1, 0, 60), t1: safeNum(m.t1, 9, 0, 60) }))
      };
    });
    pl.ballStart = ids.get(pl.ballStart) || null;
    pl.passes = (Array.isArray(pl.passes) ? pl.passes : []).filter(ps => ps && ids.has(ps.from) && ids.has(ps.to))
      .map(ps => ({ id: safeId(ps.id, "ps"), from: ids.get(ps.from), to: ids.get(ps.to), t: safeNum(ps.t, 1, 0, 60), dur: safeNum(ps.dur, 1.2, .3, 60) }));
    pl.notes = (Array.isArray(pl.notes) ? pl.notes : []).filter(n => n && typeof n === "object").map(n => ({
      id: safeId(n.id, "n"), kind: n.kind === "circle" ? "circle" : "text", x: safeNum(n.x, 0, -W, 2 * W), y: safeNum(n.y, 0, -H, 2 * H),
      text: String(n.text ?? ""), appear: safeNum(n.appear, 0, 0, 60), size: safeNum(n.size, n.kind === "circle" ? 1 : 36, .1, 400)
    }));
    return pl;
  }
  function moveStart(p, i) {
    for (let k = i - 1; k >= 0; k--) { const pp = p.moves[k].path; if (pp.length) return pp[pp.length - 1]; }
    return { x: p.x, y: p.y };
  }
  const splineOfMove = (p, i) => spline([moveStart(p, i), ...p.moves[i].path]);
  const moveProgress = (m, t) => ease(clamp((t - m.t0) / Math.max(0.1, m.t1 - m.t0)));
  function posAt(p, t) {
    for (let i = 0; i < p.moves.length; i++) {
      const m = p.moves[i];
      if (!m.path.length) continue;
      if (t < m.t0) return moveStart(p, i);
      if (t < m.t1) { const sp = splineOfMove(p, i); return pointAt(sp, moveProgress(m, t) * sp.total); }
    }
    return moveStart(p, p.moves.length);
  }
  const hasMoves = p => p.moves.some(m => m.path.length);
  const byId = id => play().players.find(p => p.id === id);

  function ballState(t) {
    const pl = play();
    let owner = byId(pl.ballStart) ? pl.ballStart : null;
    const passes = pl.passes.slice().sort((a, b) => a.t - b.t);
    for (const ps of passes) {
      const f = byId(ps.from), r = byId(ps.to);
      if (!f || !r) continue;
      if (t >= ps.t + ps.dur) { owner = ps.to; continue; }
      if (t >= ps.t) {
        const k = ease((t - ps.t) / ps.dur);
        const a = ballSpot(f, t), b = ballSpot(r, t);
        return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) - Math.sin(k * Math.PI) * 22 };
      }
      break;
    }
    if (!owner) return null;
    return ballSpot(byId(owner), t);
  }
  function ballSpot(p, t) { const q = posAt(p, t); return { x: q.x + 28 * ICON, y: q.y + 9 * ICON }; }
  function isForward(ps) {
    const f = byId(ps.from), r = byId(ps.to);
    if (!f || !r) return false;
    const a = posAt(f, ps.t), b = posAt(r, ps.t + ps.dur);
    const dir = f.team === "D" ? 1 : -1; // attack goes up the board
    return (b.y - a.y) * dir > 12;
  }

  // ---------- drawing ----------
  function rnd(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
  function markerLine(pts, w, color, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.globalAlpha = .35; ctx.lineWidth = w * .55;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x + .8, p.y + .9) : ctx.moveTo(p.x + .8, p.y + .9)); ctx.stroke();
    ctx.restore();
  }
  function arrowHead(x, y, ang, size, color, w) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x - size * Math.cos(ang - .55), y - size * Math.sin(ang - .55));
    ctx.lineTo(x, y);
    ctx.lineTo(x - size * Math.cos(ang + .55), y - size * Math.sin(ang + .55));
    ctx.stroke(); ctx.restore();
  }
  function drawBoard(pl, clean) {
    ctx.textBaseline = "alphabetic";
    const hb = headerBoxes(pl);
    if (pl.title) {
      ctx.fillStyle = C.ink; ctx.font = `${hb.title.size}px ${MARKER}`;

    if (["fIcon", "fTitleSize", "fSubSize", "fLogoSize", "fPitchSize"].includes(id)) { sliderSnap = false; changed(); return; }
    snapshot();
    if (id === "fTitle") pl.title = el.value;
    else if (id === "fSub") pl.subtitle = el.value;
    else if (id === "fLogo") pl.showLogo = el.checked;
    else if (id === "fPitch") pl.pitchView = el.value;
    else if (["fIcon", "fTitleSize", "fSubSize", "fLogoSize"].includes(id)) { /* saved live on input */ }
    else if (id === "fDur") { pl.duration = clamp(parseInt(el.value) || 15, 3, 60); $("scrub").max = pl.duration; syncTime(); }
    else if (sel && sel.type === "player" && byId(sel.id)) {
      const p = byId(sel.id);
      const mv = el.closest("[data-move]");
      if (mv && el.dataset.mf) {
        // keep moves in order with no overlap: a move can't start before the previous one ends
        const i = +mv.dataset.move, m = p.moves[i], prev = p.moves[i - 1], next = p.moves[i + 1];
        const v = num(el.value);
        if (el.dataset.mf === "t0") m.t0 = clamp(v, prev ? prev.t1 : 0, m.t1 - .2);
        else m.t1 = clamp(v, m.t0 + .2, next ? next.t0 : 60);
        if (m.t1 + 1 > pl.duration) { pl.duration = Math.min(60, Math.ceil(m.t1 + 1)); $("scrub").max = pl.duration; syncTime(); }
      }
      if (id === "fHi") p.highlight = el.checked;
      if (id === "fBall") pl.ballStart = el.checked ? p.id : null;
    } else if (sel && sel.type === "note") {
      const n = pl.notes.find(n => n.id === sel.id);
      if (n && id === "fAppear") n.appear = num(el.value);
      if (n && id === "fSize") n.size = parseFloat(el.value) || n.size;
    }
    const pi = el.closest("[data-pass]");
    if (pi && el.dataset.f) {
      const ps = pl.passes.find(p => p.id === pi.dataset.pass);
      if (ps) { const f = el.dataset.f; ps[f] = (f === "t" || f === "dur") ? Math.max(f === "dur" ? .3 : 0, num(el.value)) : el.value; }
    }
    changed();
  });
  let sliderSnap = false;
  $("inspector").addEventListener("input", e => {
    const id = e.target.id, pl = play();
    const map = { fIcon: "iconScale", fTitleSize: "titleSize", fSubSize: "subSize", fLogoSize: "logoSize", fPitchSize: "pitchScale" };
    if (map[id]) {
      if (!sliderSnap) { snapshot(); sliderSnap = true; }
      const v = parseFloat(e.target.value);
      if (id === "fLogoSize" && pl.logoPos) { const old = pl.logoSize || 150; pl.logoPos = { x: Math.round(pl.logoPos.x + old - v), y: Math.round(pl.logoPos.y + old - v) }; }
      if (id === "fLogoSize" && !pl.logoPos) { /* default anchors to bottom right */ }
      pl[map[id]] = v;
      if (id === "fIcon") $("vIcon").textContent = Math.round(v * 100) + "%";
      if (id === "fPitchSize") $("vPitch").textContent = Math.round(v * 100) + "%";
      dirty = true; saveDraft(); setStatus(); return;
    }
    if (id !== "noteText") return;
    const n = play().notes.find(n => sel && n.id === sel.id);
    if (n) { n.text = e.target.value; dirty = true; saveDraft(); setStatus(); }
  });
  $("inspector").addEventListener("click", e => {
    const pl = play(), t = e.target;
    if (t.id === "delSel") deleteSel();
    if (t.id === "clearRun") { finishMove(); snapshot(); byId(sel.id).moves = []; changed(); }
    if (t.id === "addMove") { const ids = sel.ids.slice(), lead = sel.id; setTool("run"); startMove(ids, lead); }
    if (t.dataset.delmove) { finishMove(); snapshot(); byId(sel.id).moves.splice(+t.dataset.delmove, 1); changed(); }
    if (t.dataset.delpass) { snapshot(); pl.passes = pl.passes.filter(p => p.id !== t.dataset.delpass); changed(); }
  });

  // ---------- playlist ----------
  function renderPlaylist() {
    $("plays").innerHTML = state.plays.map((p, i) => `<button type="button" data-i="${i}" class="${i === cur ? "on" : ""}">${esc(p.title || "Untitled")}</button>`).join("");
    $("delPlay").disabled = state.plays.length < 2;
  }
  function openPlay(i) {
    cur = i; sel = null; runFor = passFrom = null; undoStack = []; time = 0; setPlaying(false);
    $("scrub").max = play().duration; syncTime(); renderPlaylist(); renderInspector();
  }
  $("plays").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) openPlay(+b.dataset.i); });
  $("newPlay").addEventListener("click", () => {
    state.plays.push({ id: uid("p"), title: "NEW PLAY", subtitle: "", duration: 15, ballStart: null, players: [], passes: [], notes: [] });
    openPlay(state.plays.length - 1); setTool("x"); changed();
  });
  $("dupPlay").addEventListener("click", () => {
    const c = JSON.parse(JSON.stringify(play())); c.id = uid("p"); c.title = c.title + " (copy)";
    state.plays.splice(cur + 1, 0, c); openPlay(cur + 1); changed();
  });
  let delArmed = false;
  $("delPlay").addEventListener("click", () => {
    if (state.plays.length < 2) return;
    if (!delArmed) { delArmed = true; $("delPlay").textContent = "Click again to delete"; setTimeout(() => { delArmed = false; $("delPlay").textContent = "Delete play"; }, 3000); return; }
    delArmed = false; $("delPlay").textContent = "Delete play";
    state.plays.splice(cur, 1); openPlay(Math.max(0, cur - 1)); changed();
  });

  // ---------- transport ----------
  $("play").addEventListener("click", () => setPlaying(!playing));
  $("toStart").addEventListener("click", () => { time = 0; syncTime(); });
  $("scrub").addEventListener("input", e => { setPlaying(false); time = parseFloat(e.target.value); syncTime(); });

  // ---------- save ----------
  let artifactCap = null, canSave = true;
  const DESKTOP = !(window.claude && window.claude.use);
  function setStatus(msg) {
    if (msg) { $("status").textContent = msg; return; }
    $("status").textContent = dirty ? "Unsaved changes" : "All changes saved";
  }
  const STORE_KEY = "18thman-playlist";
  async function save() {
    if (DESKTOP) {
      state.savedAt = Date.now();
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ savedAt: state.savedAt, plays: state.plays }));
        localStorage.removeItem(DRAFT_KEY); dirty = false; setStatus("Saved on this computer");
      } catch (e) { setStatus("Couldn't save. Back up the playlist to a file instead."); }
      return;
    }
    if (!artifactCap) { setStatus("Saving isn't available here. Your work is kept in this browser."); return; }
    if (!canSave) { setStatus("You can view this playlist but not save it."); return; }
    $("save").disabled = true; setStatus("Saving…");
    state.savedAt = Date.now();
    try {
      await artifactCap.publish({ "plays.json": JSON.stringify({ savedAt: state.savedAt, plays: state.plays }) });
      dirty = false; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      setStatus();
    } catch (err) {
      const c = err && err.code;
      if (c === "not_writer" || c === "not_granted") { canSave = false; setStatus("You can view this playlist but not save it."); }
      else if (c === "conflict") setStatus("Someone else saved first. Reloading their version.");
      else if (c === "capability_disabled") setStatus("Saving isn't available in this view. Your work is kept in this browser.");
      else setStatus("Couldn't save. Try again in a moment.");
    }
    $("save").disabled = false;
  }
  $("save").addEventListener("click", save);

  // ---------- export ----------
  let downloadsCap = null;
  const slug = () => (play().title || "play").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "play";
  function exportMsg(m) { $("exportStatus").textContent = m; }
  async function saveFile(filename, data) {
    if (!downloadsCap) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      exportMsg("Saved " + filename); return;
    }
    try { await downloadsCap.save({ filename, data }); exportMsg("Saved " + filename); }
    catch (err) { exportMsg(err && err.code === "declined" ? "Save cancelled." : "Couldn't save the file."); }
  }
  $("exportPng").addEventListener("click", () => {
    render(Math.min(time, play().duration), true);
    cv.toBlob(b => { if (b) saveFile(slug() + ".png", b); });
  });
  $("exportVideo").addEventListener("click", async () => {
    if (recording) return;
    if (!window.MediaRecorder || !cv.captureStream) { exportMsg("This browser can't record video. Try Chrome or Safari on a computer."); return; }
    const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    const mime = types.find(t => MediaRecorder.isTypeSupported(t));
    if (!mime) { exportMsg("This browser can't record video."); return; }
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    setPlaying(false); sel = null; renderInspector();
    recording = true; document.querySelectorAll("button").forEach(b => b.disabled = true);
    const stream = cv.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    const total = play().duration + 1.5;
    rec.start(250);
    const t0 = performance.now();
    await new Promise(resolve => {
      const step = now => {
        const t = (now - t0) / 1000;
        render(Math.min(t, play().duration), true);
        exportMsg(`Recording… ${Math.min(t, total).toFixed(0)} / ${total.toFixed(0)}s`);
        if (t < total) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
    rec.stop(); await done;
    recording = false; document.querySelectorAll("button").forEach(b => b.disabled = false); renderPlaylist();
    const blob = new Blob(chunks, { type: mime.split(";")[0] });
    exportMsg("Video ready.");
    await saveFile(slug() + "." + ext, blob);
    if (ext === "webm") exportMsg($("exportStatus").textContent + " (WebM: convert to MP4 if your app needs it.)");
  });

  // ---------- playlist files ----------
  $("exportPlaylist").addEventListener("click", () => {
    saveFile("18thman-playlist.json", JSON.stringify({ savedAt: Date.now(), plays: state.plays }, null, 1));
  });
  $("importPlaylist").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.plays) || !d.plays.length) throw new Error("empty");
      const ids = new Set(state.plays.map(p => p.id));
      const incoming = d.plays.map(migrate); // throws on a bad entry before anything is added
      incoming.forEach(p => { if (ids.has(p.id)) p.id = uid("p"); state.plays.push(p); });
      openPlay(state.plays.length - d.plays.length); changed();
      exportMsg(`Added ${d.plays.length} play${d.plays.length > 1 ? "s" : ""} from ${f.name}.`);
    } catch (err) { exportMsg("That file isn't a playlist backup from this app."); }
  });

  // ---------- boot ----------
  async function boot() {
    let data = null;
    if (DESKTOP) { try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {} }
    else { try { const r = await fetch("plays.json", { cache: "no-store" }); if (r.ok) data = await r.json(); } catch (e) {} }
    if (!data || !data.plays || !data.plays.length) data = JSON.parse($("seed").textContent);
    let draft = null; try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
    if (draft && draft.plays && draft.plays.length && (draft.savedAt || 0) >= (data.savedAt || 0) && draft.draftAt) {
      state = { plays: draft.plays, savedAt: draft.savedAt || 0 }; dirty = true;
    } else state = { plays: data.plays, savedAt: data.savedAt || 0 };
    if (!state.plays.length) state.plays.push({ id: uid("p"), title: "NEW PLAY", subtitle: "", duration: 15, ballStart: null, players: [], passes: [], notes: [] });
    try { state.plays = state.plays.map(migrate); }
    catch (e) { state = { plays: JSON.parse($("seed").textContent).plays.map(migrate), savedAt: 0 }; dirty = false; }
    openPlay(0); setStatus(); setTool("select");
    try { await document.fonts.load(`86px ${MARKER}`); await document.fonts.load(`36px ${HAND}`); } catch (e) {}
    requestAnimationFrame(frame);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setPlaying(true);
  }
  boot();

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(a => { artifactCap = a; if (!a) setStatus(dirty ? "Unsaved changes (kept in this browser)" : "Saving isn't available here"); });
    window.claude.use("downloads").then(d => { downloadsCap = d; if (!d) { $("exportVideo").hidden = true; $("exportPng").hidden = true; exportMsg("Exports aren't available in this view."); } });
  }
})();
</script>

</body>
</html>
